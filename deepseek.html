<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>中考倒计时 · 金榜题名</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免复制数字时误触，不影响阅读 */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        /* 主卡片 */
        .countdown-card {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 4rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            padding: 2rem 1.8rem 2.8rem;
            text-align: center;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 励志徽章 */
        .badge {
            display: inline-block;
            background: #f9c74f;
            color: #2d3e50;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
            text-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        /* 考试时间醒目提示 */
        .target-date {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            display: inline-flex;
            align-items: baseline;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            font-size: 1rem;
            font-weight: 500;
            color: #ffecb3;
            border: 1px solid rgba(255,215,130,0.4);
        }
        .target-date span:first-child {
            font-weight: 400;
            opacity: 0.9;
        }
        .exam-date {
            font-weight: 700;
            color: #ffd966;
            font-family: monospace;
            font-size: 1.05rem;
            background: #2c3e2f30;
            padding: 0.2rem 0.5rem;
            border-radius: 32px;
        }

        /* 倒计时数字面板 */
        .timer-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.6rem 1.2rem;
            margin: 2rem 0 1.5rem;
        }

        .time-unit {
            background: rgba(10, 20, 30, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 0.8rem 1rem;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #f9b43a;
            transition: transform 0.2s;
        }

        .time-unit:hover {
            transform: translateY(-3px);
        }

        .number {
            font-size: 3.5rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
            background: linear-gradient(135deg, #FFF6E0, #FFD966);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .unit-label {
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0e4e8;
            margin-top: 0.4rem;
            opacity: 0.9;
        }

        .separator {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffbc6e;
            text-shadow: 0 0 6px rgba(0,0,0,0.3);
            display: none;
        }

        /* 加油口号区域 */
        .slogan {
            margin-top: 2rem;
            font-size: 1.15rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.8rem;
            border-radius: 60px;
            color: #fdebb3;
            display: inline-block;
            width: auto;
            backdrop-filter: blur(4px);
        }

        .expired-message {
            background: #c44536d0;
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 1.4rem;
            color: #ffefcf;
            margin: 1rem 0;
            letter-spacing: 1px;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #b9cded;
            opacity: 0.7;
        }

        /* 响应式 */
        @media (max-width: 580px) {
            .countdown-card {
                padding: 1.5rem 1rem 2rem;
                border-radius: 2rem;
            }
            .time-unit {
                min-width: 70px;
                padding: 0.5rem 0.8rem;
            }
            .number {
                font-size: 2.3rem;
            }
            .unit-label {
                font-size: 0.7rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .target-date {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 450px) {
            .timer-panel {
                gap: 0.6rem;
            }
            .time-unit {
                min-width: 65px;
            }
            .number {
                font-size: 2rem;
            }
        }

        /* 避免a标签默认样式干扰 */
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>

<div class="countdown-card">
    <div class="badge">🏆 全力以赴 · 未来可期 🏆</div>
    <h1>⏳ 中考倒计时 ⏳</h1>

    <!-- 显示中考目标日期 (本地化清晰) -->
    <div class="target-date">
        <span>📅 中考时间 · </span>
        <span class="exam-date" id="examDateDisplay">2026年6月20日 上午 09:00</span>
        <span> 🕊️ 赴梦想之约</span>
    </div>

    <!-- 倒计时数字区 保持原id结构 d/h/m/s 便于与原逻辑兼容但完全升级 -->
    <div class="timer-panel" id="timerPanel">
        <div class="time-unit">
            <div class="number" id="d">0</div>
            <div class="unit-label">DAYS<br>天</div>
        </div>
        <div class="time-unit">
            <div class="number" id="h">0</div>
            <div class="unit-label">HOURS<br>时</div>
        </div>
        <div class="time-unit">
            <div class="number" id="m">0</div>
            <div class="unit-label">MINUTES<br>分</div>
        </div>
        <div class="time-unit">
            <div class="number" id="s">0</div>
            <div class="unit-label">SECONDS<br>秒</div>
        </div>
    </div>

    <!-- 动态鼓励 / 过期信息展示区 -->
    <div id="messageArea" class="slogan">
        🌟 乾坤未定，你我皆是黑马 🌟
    </div>
    <div class="footer-note">
        ✨ 以梦为马，不负韶华 ✨
    </div>
</div>

<script>
    (function() {
        // ----------------------------- 配置区域 ---------------------------------
        // 设定中考目标时间 (本地时间) 
        // 可根据实际情况修改: 年份, 月份(0-11), 日期, 小时, 分钟, 秒
        // 预设为 2026年6月20日 上午 09:00:00 (中考通常首科开考时间)
        const TARGET_YEAR = 2026;
        const TARGET_MONTH = 5;     // 5 表示 6月 (0=1月)
        const TARGET_DAY = 20;
        const TARGET_HOUR = 9;
        const TARGET_MINUTE = 0;
        const TARGET_SECOND = 0;
        
        // 创建本地目标日期对象 (基于浏览器当前时区)
        const targetDate = new Date(TARGET_YEAR, TARGET_MONTH, TARGET_DAY, TARGET_HOUR, TARGET_MINUTE, TARGET_SECOND);
        
        // 显示中考具体日期(友好格式)
        const examDateElem = document.getElementById('examDateDisplay');
        if (examDateElem) {
            // 格式化显示: 2026年6月20日 09:00
            const year = targetDate.getFullYear();
            const month = targetDate.getMonth() + 1;
            const day = targetDate.getDate();
            const hour = targetDate.getHours();
            const minute = targetDate.getMinutes();
            const hourStr = hour < 10 ? '0' + hour : hour;
            const minuteStr = minute < 10 ? '0' + minute : minute;
            examDateElem.innerText = `${year}年${month}月${day}日 ${hourStr}:${minuteStr}`;
        }
        
        // DOM 元素绑定 (原id结构保留兼容)
        const daysSpan = document.getElementById('d');
        const hoursSpan = document.getElementById('h');
        const minutesSpan = document.getElementById('m');
        const secondsSpan = document.getElementById('s');
        const messageDiv = document.getElementById('messageArea');
        
        // 定时器ID
        let intervalId = null;
        
        // 辅助函数: 补零 (两位数字)
        function padZero(num) {
            return num < 10 ? '0' + num : num;
        }
        
        // 核心更新倒计时函数
        function updateCountdown() {
            // 当前时刻的时间戳 (毫秒, 本地时刻对应的毫秒)
            const now = Date.now();
            // 目标时间戳 (毫秒, 与now同一基准)
            const targetTime = targetDate.getTime();
            let remainingMs = targetTime - now;
            
            // 倒计时已结束 (剩余时间 <= 0)
            if (remainingMs <= 0) {
                // 停止定时器 (仅停止一次)
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                // 界面全部置零并显示暖心完结语
                daysSpan.innerText = '0';
                hoursSpan.innerText = '00';
                minutesSpan.innerText = '00';
                secondsSpan.innerText = '00';
                
                // 展示祝福 / 考试进行中消息
                if (messageDiv) {
                    messageDiv.innerHTML = '🎉 中考正在进行 · 愿你执笔如愿，金榜题名！ 🎉';
                    messageDiv.classList.add('expired-message');
                    messageDiv.style.fontSize = '1.2rem';
                    messageDiv.style.fontWeight = 'bold';
                }
                return;
            }
            
            // 计算天、时、分、秒
            const totalSeconds = Math.floor(remainingMs / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            // 更新显示 (天数不用补零，时/分/秒补零更美观)
            daysSpan.innerText = days;
            hoursSpan.innerText = padZero(hours);
            minutesSpan.innerText = padZero(minutes);
            secondsSpan.innerText = padZero(seconds);
            
            // 动态励志语 (根据剩余天数展示不同鼓励文案，增加趣味)
            if (messageDiv && !messageDiv.classList.contains('expired-message')) {
                if (days <= 0 && hours <= 0 && minutes <= 30) {
                    messageDiv.innerHTML = '⚡ 最后冲刺 · 冷静应考，你就是黑马 ⚡';
                } else if (days <= 3) {
                    messageDiv.innerHTML = '🔥 最后三天 · 稳住心态，超常发挥 🔥';
                } else if (days <= 10) {
                    messageDiv.innerHTML = '📖 决战在即 · 每一秒都弥足珍贵 📖';
                } else if (days <= 30) {
                    messageDiv.innerHTML = '✍️ 厚积薄发 · 盛夏属于你 ✍️';
                } else {
                    messageDiv.innerHTML = '🌟 乾坤未定，全力以赴，未来可期 🌟';
                }
            }
        }
        
        // 初始化倒计时 + 启动定时器
        function initCountdown() {
            // 先立即更新一次避免延迟
            updateCountdown();
            
            // 如果倒计时未结束且定时器未启动，则启动定时器
            if (!intervalId) {
                // 检查是否已经过期 (已经过期的上面updateCountdown会清除定时器)
                const now = Date.now();
                const targetTime = targetDate.getTime();
                if (targetTime > now) {
                    intervalId = setInterval(updateCountdown, 1000);
                } else {
                    // 已经过期，无需定时器，但已经通过updateCountdown显示了毕业信息
                    if (messageDiv) {
                        messageDiv.innerHTML = '🏁 中考已进行中 · 愿你合上笔盖那一刻，有着战士收刀般的骄傲 🏁';
                        messageDiv.classList.add('expired-message');
                    }
                }
            }
        }
        
        // 页面可见性变化时，保证计时器不被过度休眠影响 (可选优化)
        // 当页面重新可见时，强制刷新一次数据并且确保定时器存在(如果未过期且定时器意外丢失)
        function onVisibilityChange() {
            if (!document.hidden) {
                // 重新核对倒计时状态
                const now = Date.now();
                const targetTime = targetDate.getTime();
                // 如果还没过期，但是定时器停了，则重新启动确保倒计时继续
                if (targetTime > now && !intervalId) {
                    intervalId = setInterval(updateCountdown, 1000);
                }
                // 立即刷新一次保证显示正确
                updateCountdown();
            }
        }
        
        // 页面关闭前清理定时器(非必须，只是良好习惯)
        function cleanUp() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }
        
        // 检查目标日期合法性 (如果用户意外设置了历史时间，给出友善提醒)
        function validateTargetDate() {
            const now = Date.now();
            if (targetDate.getTime() <= now) {
                // 如果目标时间 <= 当前时间，展示已经进入中考的样式
                if (messageDiv) {
                    messageDiv.innerHTML = '📢 中考正在进行中！稳住心态，胜利在望！ 📢';
                    messageDiv.classList.add('expired-message');
                }
                // 确保显示零值
                daysSpan.innerText = '0';
                hoursSpan.innerText = '00';
                minutesSpan.innerText = '00';
                secondsSpan.innerText = '00';
                // 此时不需要定时器
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                return false;
            }
            return true;
        }
        
        // 主流程启动
        function bootstrap() {
            // 先做预检: 如果目标日期有效且未过期，启动倒计时；否则显示结束样式。
            const isValid = validateTargetDate();
            if (isValid) {
                initCountdown();
            } else {
                // 如果过期，无需定时器，但展示样式
                if (messageDiv) {
                    messageDiv.innerHTML = '🎯 中考加油 · 所有努力终将闪光 🎯';
                }
            }
            // 监听页面可见性变化，优化后台定时器不必要频繁但保证恢复
            document.addEventListener('visibilitychange', onVisibilityChange);
            // 页面卸载时清理定时器
            window.addEventListener('beforeunload', cleanUp);
        }
        
        // 确保DOM完全加载后再执行 (避免意外元素未找到)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootstrap);
        } else {
            bootstrap();
        }
    })();
</script>
</body>
</html>
