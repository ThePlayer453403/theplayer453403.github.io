<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>我的世界玩家类型指标 (MCTI) | 像素人格测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2b2b1f url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" fill="%233c3c2a"/><rect x="0" y="0" width="16" height="16" fill="%234f4f38" opacity="0.5"/><rect x="16" y="16" width="16" height="16" fill="%234f4f38" opacity="0.5"/></svg>');
            font-family: 'Segoe UI', 'Minecraft', 'Courier New', monospace;
            padding: 2rem 1rem;
        }

        /* 主容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(30, 24, 18, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,240,0.1);
            border: 1px solid #8b7355;
            overflow: hidden;
        }

        /* 头部 */
        .hero {
            background: linear-gradient(135deg, #1e3c2c, #2a5a3a);
            padding: 1.8rem 2rem;
            text-align: center;
            border-bottom: 4px solid #f3b33d;
        }
        .hero h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #ffde9c;
            text-shadow: 3px 3px 0 #5a3e1a;
            font-weight: bold;
        }
        .hero .sub {
            color: #e6e0b3;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-family: monospace;
        }
        .badge {
            background: #2c2116;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #ffcd85;
            margin-top: 0.6rem;
        }

        /* 题目区域 */
        .questions-panel {
            padding: 1.8rem 2rem;
        }
        .question-card {
            background: #fef3dd;
            border-radius: 1.5rem;
            padding: 1rem 1.4rem;
            margin-bottom: 1.3rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
            border-left: 8px solid #c97e2c;
        }
        .q-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: #3b2a1f;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .q-num {
            background: #5a3e1a;
            color: #f7e5b5;
            border-radius: 40px;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 0.3rem;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #e7dbbc;
            padding: 0.4rem 1rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
        }
        .option:hover {
            background: #dbbc87;
        }
        input[type="radio"] {
            accent-color: #4f6b3c;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        label {
            cursor: pointer;
            font-weight: 500;
        }

        /* 按钮区 */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            padding: 0.5rem 2rem 2rem 2rem;
            flex-wrap: wrap;
        }
        button {
            background: #5c4327;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            padding: 0.7rem 2rem;
            border-radius: 2rem;
            color: #ffefbf;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #2b1e0f;
        }
        button:hover {
            background: #7a5938;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #2b1e0f;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2b1e0f;
        }
        .reset-btn {
            background: #4f3a24;
            box-shadow: 0 3px 0 #2a1e12;
        }

        /* 结果区域 */
        .result-container {
            background: #241f17e0;
            margin: 0 2rem 2rem 2rem;
            border-radius: 2rem;
            padding: 1.6rem;
            backdrop-filter: blur(4px);
            border: 1px solid #c0a16b;
            color: #fff3e0;
        }
        .result-header {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            font-family: monospace;
            letter-spacing: 3px;
            background: #00000066;
            border-radius: 2rem;
            padding: 0.3rem;
        }
        .type-name {
            background: #e7b874;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #241f17;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        .subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffdd99;
            margin-top: 0.5rem;
        }
        .desc {
            line-height: 1.5;
            margin-top: 0.8rem;
            font-size: 0.95rem;
        }
        .dimension-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background: #2c261c;
            border-radius: 1.5rem;
            padding: 0.7rem;
            margin-top: 1rem;
            font-size: 0.8rem;
            gap: 0.8rem;
        }
        .stat {
            background: #3f3527;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        hr {
            margin: 1rem 0;
            border-color: #7c603b;
        }
        .footnote {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            opacity: 0.8;
        }
        @media (max-width: 620px) {
            .questions-panel {
                padding: 1rem;
            }
            .option {
                padding: 0.3rem 0.7rem;
                font-size: 0.8rem;
            }
            .result-header {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>⚡ MCTI 评估 ⚡</h1>
        <div class="sub">Minecraft Crafting Type Indicator · 我的世界像素人格解析</div>
        <div class="badge">🎮 15道题 | 四大维度 | 16种玩家灵魂</div>
    </div>

    <div class="questions-panel" id="questionsPanel">
        <!-- 题目会通过js动态生成，保证整洁和一致性 -->
    </div>

    <div class="action-bar">
        <button id="submitBtn">🏆 分析我的玩家类型</button>
        <button id="resetBtn" class="reset-btn">🔄 重新选择</button>
    </div>

    <div id="resultArea" class="result-container" style="display: none;">
        <!-- 动态显示结果 -->
    </div>
</div>

<script>
    // ---------- 题目数据 (基于原对话15题, 附加题14/15不计入主维度但保留，仅作趣味展示) ----------
    // 维度说明: 1~3 EI, 4~6 SN, 7~9 TF, 10~13 JP (主维度)
    // 附加题14、15不计入四字母核心结果，但保留完整测试体验，结果页展示附加倾向参考。
    const questions = [
        { text: "开新档时，你通常：", options: ["A. 立即邀请朋友一起玩，或者直接进入多人服务器。", "B. 开启单人模式，享受属于自己的世界。"], dim: "EI", valA: "E", valB: "I" },
        { text: "完成一个大型建筑后，你更愿意：", options: ["A. 发到社区、找朋友参观、举办派对。", "B. 独自欣赏，默默规划下一个项目。"], dim: "EI", valA: "E", valB: "I" },
        { text: "你在游戏中最享受的时刻是：", options: ["A. 和大家一起下矿、打龙、玩小游戏。", "B. 一个人听着音乐，安静地整理箱子或种田。"], dim: "EI", valA: "E", valB: "I" },
        
        { text: "当你规划一个新基地时，你首先考虑：", options: ["A. 地形是否平坦、附近有哪些资源、房子要多大才能放下所有工作台。", "B. 建筑的整体风格、主题故事、以及与周围景观的艺术感。"], dim: "SN", valA: "S", valB: "N" },
        { text: "看到别人建了一个“像素画”或“红石计算机”，你反应是：", options: ["A. 真厉害，但感觉太复杂，我还是更喜欢建个实用农场。", "B. 太酷了！我也要研究原理，做点更创新的东西。"], dim: "SN", valA: "S", valB: "N" },
        { text: "你认为游戏中最有趣的“资源”是：", options: ["A. 钻石、下界合金等实用装备材料。", "B. 命令方块、结构方块、数据包等创造可能性的工具。"], dim: "SN", valA: "S", valB: "N" },
        
        { text: "你的自动化农场出现故障，你会：", options: ["A. 检查线路逻辑，寻找最低延迟、最高效率的修复方案。", "B. 只要能工作就行，形状好不好看、动物是否舒服也很重要。"], dim: "TF", valA: "T", valB: "F" },
        { text: "和朋友一起玩时，分配矿物或战利品，你认为：", options: ["A. 按贡献科学分配，或者用“时运”的人需要上交额外部分。", "B. 谁需要就谁拿，或者随便分，只要大家开心。"], dim: "TF", valA: "T", valB: "F" },
        { text: "你更会因为什么而拆掉一栋旧建筑？", options: ["A. 它阻断了最优交通路线，或者空间利用率太低。", "B. 它让你想起了不愉快的经历，或者单纯“看腻了”。"], dim: "TF", valA: "T", valB: "F" },
        
        { text: "打开游戏前，你通常会：", options: ["A. 心里有计划：“今天要把城堡的东翼屋顶盖完”。", "B. 随缘：“先看看风景，也许挖挖矿，也许到处跑跑”。"], dim: "JP", valA: "J", valB: "P" },
        { text: "你的箱子/物品栏通常是：", options: ["A. 分类摆放，甚至有专门的“矿物箱”“建筑箱”“红石箱”。", "B. 乱七八糟，有空位就塞，东西总能找到（大概）。"], dim: "JP", valA: "J", valB: "P" },
        { text: "当你遇到一个废弃矿井，你会：", options: ["A. 按顺序探索一条路线，留下火把标记，确保不遗漏。", "B. 到处乱跑，看到岔路就钻，经常迷路但总能发现惊喜。"], dim: "JP", valA: "J", valB: "P" },
        { text: "你对“完成游戏”（击败末影龙）的态度是：", options: ["A. 它是一个明确的目标，应该尽快完成，然后开启新阶段。", "B. 走不走都行，我可能先建十个农场再去，或者永远不去。"], dim: "JP", valA: "J", valB: "P" },
        
        // 附加题1 (14)
        { text: "你在服务器里更喜欢：", options: ["A. 组织活动、建立城镇、制定规则。", "B. 独自在远方隐居，偶尔出现交换物品。"], dim: "EXTRA", valA: null, valB: null, note: "辅助参考" },
        // 附加题2 (15)
        { text: "看到一种新的红石装置设计，你会：", options: ["A. 立刻分析能否用更少的材料实现同样功能。", "B. 研究它的外观能否融入我的建筑风格。"], dim: "EXTRA", valA: null, valB: null, note: "辅助参考" }
    ];

    // 16种类型的详细描述映射 (称号 + 风格描述)
    const typeData = {
        "INTJ": { title: "⚙️ 总体规划师", desc: "沉迷于大型自动化系统，先画图纸再动工，永远在优化。末影箱里也有Excel。他们的世界就像精密的机器，每个方块都有使命。" },
        "INTP": { title: "🔌 红石理论家", desc: "研究方块的逻辑极限，建出别人看不懂的装置，然后拆掉重做更完美的版本。比起生存更爱破解机制，是红石电路的哲人。" },
        "ENTJ": { title: "🏛️ 服务器领袖", desc: "组织玩家、划分领地、建立经济系统，效率至上。基地是一座功能性城市，指挥若定，开拓疆土如同将军。" },
        "ENTP": { title: "💡 创意颠覆者", desc: "不断想出新奇点子（比如用地狱交通代替主世界），但经常烂尾，因为又有了新想法。服务器里的脑洞发电机。" },
        "ISFJ": { title: "🍃 守护型村民", desc: "喜欢建造温馨小屋、种田、养动物，基地打理井井有条。他们是服务器里的后勤英雄，默默照顾所有人的农田。" },
        "ISTJ": { title: "⛏️ 经典生存者", desc: "遵循传统玩法：挖矿→附魔→打龙。房子方方正正但功能完善，注重秩序与实用性，永远储备三箱食物。" },
        "ESFJ": { title: "🤝 社区管家", desc: "热衷于建造公共设施（刷怪塔、交易大厅），并照顾其他玩家的需求。谁饿了找他们，社区和谐的基石。" },
        "ESTJ": { title: "📜 秩序维护者", desc: "服务器里制定规则，监督大家不乱丢垃圾、不破坏地形。基地像军营一样整齐，不允许混乱存在。" },
        "ISFP": { title: "🎨 隐士艺术家", desc: "在隐秘山谷里建精致小筑，种满花草，不追求效率只追求意境。地图上几乎找不到他们，但会发现惊喜建筑。" },
        "ISTP": { title: "🛠️ 实用巧手", desc: "擅长一切手动技术：跑酷、PVP、速通。不建宏伟建筑，但工具永远顶级附魔，关键时刻力挽狂澜。" },
        "ESFP": { title: "🎉 派对玩家", desc: "最喜欢服务器小游戏：掘战、饥饿游戏、跑酷。基地只是放装备的地方，他们活在刹那的欢笑声中。" },
        "ESTP": { title: "🔥 大胆冒险家", desc: "直闯远古城市、以命搏命、速通挑战。信条是“先做了再说，死了大不了重来”。享受刺激和即兴发挥。" },
        "INFJ": { title: "📖 史诗叙事者", desc: "每个建筑都有故事背景，整个地图是一个连贯的传说。你会发现他们留下的日记，世界因意义而存在。" },
        "INFP": { title: "✨ 梦幻造景师", desc: "建造漂浮岛屿、魔法森林、童话城堡，追求意境美。不关心红石，只关心光影和配色，内心住着诗人。" },
        "ENFJ": { title: "🌟 愿景导师", desc: "在服务器里发起大型项目（比如复原君士坦丁堡），并鼓舞所有人参与。擅长分配任务，让每个玩家找到价值。" },
        "ENFP": { title: "🌈 灵感迸发者", desc: "今天建个摩天轮，明天挖个地底城市，后天去玩模组。世界是永远未完成的狂欢，充满可能性与热情。" }
    };

    // 辅助获取维度结果
    function computeType(answers) {
        // answers: 数组 index 0~14 (0-based) 存储选中的值 'A' 或 'B'
        let counts = { EI: { E:0, I:0 }, SN: { S:0, N:0 }, TF: { T:0, F:0 }, JP: { J:0, P:0 } };
        
        // 1~3 EI
        for(let i=0;i<3;i++) {
            let ans = answers[i];
            if(ans === 'A') counts.EI.E++;
            else if(ans === 'B') counts.EI.I++;
        }
        // 4~6 SN
        for(let i=3;i<6;i++) {
            let ans = answers[i];
            if(ans === 'A') counts.SN.S++;
            else if(ans === 'B') counts.SN.N++;
        }
        // 7~9 TF
        for(let i=6;i<9;i++) {
            let ans = answers[i];
            if(ans === 'A') counts.TF.T++;
            else if(ans === 'B') counts.TF.F++;
        }
        // 10~13 JP
        for(let i=9;i<13;i++) {
            let ans = answers[i];
            if(ans === 'A') counts.JP.J++;
            else if(ans === 'B') counts.JP.P++;
        }
        
        let typeEI = counts.EI.E >= counts.EI.I ? 'E' : 'I';
        let typeSN = counts.SN.S >= counts.SN.N ? 'S' : 'N';
        let typeTF = counts.TF.T >= counts.TF.F ? 'T' : 'F';
        let typeJP = counts.JP.J >= counts.JP.P ? 'J' : 'P';
        
        // 防平局处理 (如果平局取后者视觉效果，但很少会有平局，不过保底防错)
        if(counts.EI.E === counts.EI.I) typeEI = 'I'; // 内敛倾向默认偏I (可选)
        if(counts.SN.S === counts.SN.N) typeSN = 'N';
        if(counts.TF.T === counts.TF.F) typeTF = 'F';
        if(counts.JP.J === counts.JP.P) typeJP = 'J';
        
        let fourType = typeEI + typeSN + typeTF + typeJP;
        // 确保映射存在
        if(!typeData[fourType]) fourType = "INTP"; // fallback
        return { fourType, counts };
    }

    // 渲染题目
    function renderQuestions() {
        const container = document.getElementById('questionsPanel');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            const qNum = idx+1;
            let dimTag = '';
            if(idx < 13) dimTag = `<span style="font-size:0.7rem; background:#ae8f5f; padding:2px 8px; border-radius:20px; margin-left:8px;">${q.dim}</span>`;
            qDiv.innerHTML = `
                <div class="q-title">
                    <span class="q-num">${qNum}</span>
                    <span>${q.text}</span>
                    ${dimTag}
                </div>
                <div class="options">
                    <div class="option" data-val="A">
                        <input type="radio" name="q${qNum}" id="q${qNum}_A" value="A"> 
                        <label for="q${qNum}_A">${q.options[0]}</label>
                    </div>
                    <div class="option" data-val="B">
                        <input type="radio" name="q${qNum}" id="q${qNum}_B" value="B"> 
                        <label for="q${qNum}_B">${q.options[1]}</label>
                    </div>
                </div>
            `;
            container.appendChild(qDiv);
        });
    }

    // 获取所有答案 (返回数组长度15, 未选则为null)
    function getAllAnswers() {
        let answers = [];
        for(let i=1;i<=questions.length;i++) {
            let selected = document.querySelector(`input[name="q${i}"]:checked`);
            if(selected) {
                answers.push(selected.value);
            } else {
                answers.push(null);
            }
        }
        return answers;
    }

    // 显示结果
    function displayResult() {
        const answers = getAllAnswers();
        const allFilled = answers.slice(0,13).every(v => v !== null); // 主13题必填，附加选填但不必强制
        if(!allFilled) {
            alert("请先完成前13道核心题目～ 让我们更精准找到你的Minecraft灵魂类型！");
            return;
        }
        
        const { fourType, counts } = computeType(answers.slice(0,13));
        const profile = typeData[fourType] || typeData["INTP"];
        
        // 附加题14、15结果趣味展示
        const extra14 = answers[13] ? (answers[13] === 'A' ? "组织者/规则制定者" : "隐居独行侠") : "未选择";
        const extra15 = answers[14] ? (answers[14] === 'A' ? "效率优先，极简至上" : "美学融合，风格至上") : "未选择";
        
        // 构建维度倾向字符串
        const eiStr = counts.EI.E >= counts.EI.I ? `E ${counts.EI.E} : I ${counts.EI.I}` : `I ${counts.EI.I} : E ${counts.EI.E}`;
        const snStr = counts.SN.S >= counts.SN.N ? `S ${counts.SN.S} : N ${counts.SN.N}` : `N ${counts.SN.N} : S ${counts.SN.S}`;
        const tfStr = counts.TF.T >= counts.TF.F ? `T ${counts.TF.T} : F ${counts.TF.F}` : `F ${counts.TF.F} : T ${counts.TF.T}`;
        const jpStr = counts.JP.J >= counts.JP.P ? `J ${counts.JP.J} : P ${counts.JP.P}` : `P ${counts.JP.P} : J ${counts.JP.J}`;
        
        const resultHtml = `
            <div class="result-header">
                🎮 ${fourType} · ${profile.title}
            </div>
            <div style="text-align:center; margin-top:5px;">
                <span class="type-name">${fourType} - ${profile.title}</span>
            </div>
            <div class="desc">
                ✨ <strong>玩家素描</strong>：${profile.desc}
            </div>
            <hr>
            <div class="dimension-stats">
                <div class="stat">🧭 精力 (E/I) : ${eiStr}</div>
                <div class="stat">🌿 认知 (S/N) : ${snStr}</div>
                <div class="stat">⚖️ 决策 (T/F) : ${tfStr}</div>
                <div class="stat">🗂️ 行动 (J/P) : ${jpStr}</div>
            </div>
            <div class="footnote">
                🧱 附加倾向参考：<br>
                🏘️ 服务器角色：${extra14} &nbsp;|&nbsp; 🔧 红石/建筑哲学：${extra15}<br>
                ※ 核心类型完全基于前13道主维度题目（EI/SN/TF/JP），附加题仅供娱乐共鸣。
            </div>
            <div style="margin-top:12px; font-size:0.8rem; background:#3b2e1f; border-radius:1rem; padding:8px; text-align:center;">
                💎 “你的世界，由你的方块哲学定义”
            </div>
        `;
        const resultContainer = document.getElementById('resultArea');
        resultContainer.style.display = 'block';
        resultContainer.innerHTML = resultHtml;
        // 滚动到结果
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    function resetSelections() {
        const allRadios = document.querySelectorAll('input[type="radio"]');
        allRadios.forEach(radio => radio.checked = false);
        const resultDiv = document.getElementById('resultArea');
        if(resultDiv) resultDiv.style.display = 'none';
        // 可选简易提示清空
    }
    
    // 绑定事件和初始化
    document.addEventListener('DOMContentLoaded', () => {
        renderQuestions();
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        submitBtn.addEventListener('click', displayResult);
        resetBtn.addEventListener('click', resetSelections);
    });
</script>
</body>
</html>
